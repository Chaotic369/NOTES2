[package]
name = "ntnotes"
version = "0.1.0"
edition = "2021"
description = "Native Windows notes app (eframe/egui) with Firebase Realtime Database sync"
rust-version = "1.76"

[dependencies]
eframe = "=0.29.1"
reqwest = { version = "=0.12.9", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"
uuid = { version = "=1.11.0", features = ["v4"] }
chrono = "=0.4.38"
directories = "=5.0.1"
sha2 = "=0.10.8"
base64 = "=0.22.1"
rand = "=0.8.5"
tiny_http = "=0.12.0"
open = "=5.3.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
